<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Mobile Ranking</title>
    <style>
        :root { 
            --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --header: #334155; --accent: #fbbf24; --row-bg: #26364f; 
            /* Dark mode boje za mečeve */
            --green-bg: #166534; --green-text: #4ade80;
            --red-bg: #991b1b; --red-text: #f87171;
            /* Boje za MAX (narandžasta) i MIN (plava) u Dark mode-u */
            --max-bg: #7c2d12; --max-text: #fdba74;
            --min-bg: #1e3a8a; --min-text: #93c5fd;
        }
        body.light { 
            --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --header: #e2e8f0; --accent: #2563eb; --row-bg: #f1f5f9; 
            /* Light mode boje za mečeve (pastelne) */
            --green-bg: #e2f8eb; --green-text: #15803d;
            --red-bg: #fde8e8; --red-text: #b91c1c;
            /* Boje za MAX i MIN u Light mode-u */
            --max-bg: #ffedd5; --max-text: #c2410c;
            --min-bg: #dbeafe; --min-text: #1d4ed8;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); transition: 0.3s; padding: 4px; margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 100%; background: var(--card); border-radius: 6px; padding: 8px; box-sizing: border-box; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        h1 { font-size: 1rem; color: var(--accent); text-transform: uppercase; margin: 0; }
        button { cursor: pointer; padding: 4px 8px; border-radius: 4px; border: none; background: var(--accent); color: #fff; font-weight: bold; font-size: 0.7rem; }
        body.light button { color: #fff; }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0 3px; table-layout: fixed; }
        th { color: #94a3b8; font-size: 0.6rem; padding: 4px 1px; text-transform: uppercase; text-align: center; overflow: hidden; }
        th:nth-child(2) { text-align: left; padding-left: 4px; }
        
        td { background: var(--row-bg); padding: 5px 1px; text-align: center; font-size: 0.7rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
        td:nth-child(2) { text-align: left; font-weight: 500; padding-left: 4px; }
        
        /* Širine kolona da sve stane bez skrolovanja */
        th:nth-child(1), td:nth-child(1) { width: 7%; }  /* # */
        th:nth-child(2), td:nth-child(2) { width: 27%; } /* Player */
        th:nth-child(3), td:nth-child(3) { width: 9%; }  /* GP */
        th:nth-child(4), td:nth-child(4) { width: 12%; } /* AVG */
        th:nth-child(5), td:nth-child(5) { width: 9%; }  /* MAX */
        th:nth-child(6), td:nth-child(6) { width: 9%; }  /* MIN */
        th:nth-child(7), td:nth-child(7) { width: 27%; } /* L5 */

        tr td:first-child { border-radius: 4px 0 0 4px; font-weight: bold; color: var(--accent); }
        tr td:last-child { border-radius: 0 4px 4px 0; }
        
        .match-badge { display: inline-block; width: 14px; height: 16px; line-height: 16px; text-align: center; border-radius: 2px; font-weight: bold; font-size: 0.55rem; margin: 0 0.5px; }
        .bg-green { background-color: var(--green-bg); color: var(--green-text); }
        .bg-red { background-color: var(--red-bg); color: var(--red-text); }
        
        /* Klase za obojen MAX i MIN */
        .max-badge { background-color: var(--max-bg); color: var(--max-text); font-weight: bold; border-radius: 3px; padding: 1px 3px; }
        .min-badge { background-color: var(--min-bg); color: var(--min-text); font-weight: bold; border-radius: 3px; padding: 1px 3px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <h1>Player Ranking</h1>
        <button onclick="document.body.classList.toggle('light')">Theme</button>
    </div>
    <table id="rankingTable">
        <thead>
            <tr>
                <th>#</th><th>Player</th><th>GP</th><th>AVG</th><th>MAX</th><th>MIN</th><th>L5</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
    const SHEET_ID = '16OTm4bC-YKAoJl7Rsw8bQLfrdYvUsbZ94Vic65KcMEY';
    const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Ranking`;

    fetch(URL)
        .then(res => res.text())
        .then(data => {
            const json = JSON.parse(data.substr(47).slice(0, -2));
            const tbody = document.querySelector('#rankingTable tbody');
            
            const validRows = json.table.rows.filter(row => row.c[0]?.v && typeof row.c[0].v === 'string' && row.c[0].v.trim() !== "" && row.c[0].v !== "Player");

            validRows.forEach((row, index) => {
                const player = row.c[0].v;
                const gp = row.c[1]?.v || '';
                const goals = row.c[2]?.v ? Number(row.c[2].v).toFixed(2) : '';
                const max = row.c[3]?.v || '';
                const min = row.c[4]?.v || '';

                let matchesHtml = '';
                for (let i = 5; i <= 9; i++) {
                    const val = row.c[i]?.v;
                    if (val !== undefined && val !== null && val !== '') {
                        const score = Number(val);
                        const badgeClass = score >= 34 ? 'bg-green' : 'bg-red';
                        matchesHtml += `<span class="match-badge ${badgeClass}">${score}</span>`;
                    }
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${player}</td>
                    <td>${gp}</td>
                    <td style="font-weight:bold;">${goals}</td>
                    <td><span class="max-badge">${max}</span></td>
                    <td><span class="min-badge">${min}</span></td>
                    <td>${matchesHtml}</td>
                `;
                tbody.appendChild(tr);
            });
        });
</script>
</body>
</html>
