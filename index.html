<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Mobile Ranking</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --header: #334155; --accent: #fbbf24; }
        body.light { --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --header: #e2e8f0; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); transition: 0.3s; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; background: var(--card); border-radius: 12px; padding: 20px; border: 1px solid var(--header); }
        .controls { display: flex; justify-content: space-between; margin-bottom: 20px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        th { color: #94a3b8; font-size: 0.75rem; padding: 10px; text-transform: uppercase; }
        td { background: #26364f; padding: 12px; text-align: center; color: white; }
        body.light td { background: #e2e8f0; color: #1e293b; }
        .val-good { color: #22c55e; font-weight: bold; }
        .val-bad { color: #ef4444; font-weight: bold; }
        button { cursor: pointer; padding: 8px 16px; border-radius: 6px; border: none; background: var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <h1>RANKING</h1>
        <button onclick="document.body.classList.toggle('light')">Light/Dark Mode</button>
    </div>
    <table id="rankingTable">
        <thead><tr><th>#</th><th>PLAYER</th><th>AVG</th><th>LAST 5</th></tr></thead>
        <tbody></tbody>
    </table>
</div>

<script>
    const SHEET_ID = '16OTm4bC-YKAoJl7Rsw8bQLfrdYvUsbZ94Vic65KcMEY';
    const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Ranking`;

    fetch(URL).then(res => res.text()).then(data => {
        const json = JSON.parse(data.substr(47).slice(0, -2));
        const tbody = document.querySelector('#rankingTable tbody');
        
        json.table.rows.forEach((row, index) => {
            const avg = parseFloat(row.c[2]?.v || 0);
            const last5 = row.c[5]?.v || ""; // Pretpostavka da je kolona 5
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td style="text-align:left">${row.c[0]?.v}</td>
                <td class="${avg >= 34 ? 'val-good' : 'val-bad'}">${avg.toFixed(1)}</td>
                <td>${last5}</td>
            `;
            tbody.appendChild(tr);
        });
    });
</script>
</body>
</html>
