<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Mobile Player Ranking</title>
    <style>
        :root { 
            --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --header: #334155; --accent: #fbbf24; --row-bg: #26364f; 
        }
        body.light { 
            --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --header: #e2e8f0; --accent: #2563eb; --row-bg: #f1f5f9; 
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); transition: 0.3s; padding: 5px; margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 100%; background: var(--card); border-radius: 8px; padding: 10px; box-sizing: border-box; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        h1 { font-size: 1.1rem; color: var(--accent); text-transform: uppercase; margin: 0; }
        button { cursor: pointer; padding: 5px 10px; border-radius: 6px; border: none; background: var(--accent); color: #fff; font-weight: bold; font-size: 0.75rem; }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0 4px; table-layout: fixed; }
        th { color: #94a3b8; font-size: 0.65rem; padding: 6px 2px; text-transform: uppercase; text-align: center; overflow: hidden; }
        th:nth-child(2) { text-align: left; }
        
        td { background: var(--row-bg); padding: 6px 2px; text-align: center; font-size: 0.75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
        td:nth-child(2) { text-align: left; font-weight: 500; }
        
        /* Širine kolona da sve stane na ekran */
        th:nth-child(1), td:nth-child(1) { width: 8%; }  /* # */
        th:nth-child(2), td:nth-child(2) { width: 28%; } /* Ime */
        th:nth-child(3), td:nth-child(3) { width: 10%; } /* GP */
        th:nth-child(4), td:nth-child(4) { width: 13%; } /* AVG */
        th:nth-child(5), td:nth-child(5) { width: 10%; } /* MAX */
        th:nth-child(6), td:nth-child(6) { width: 10%

}; /* MIN */
        th:nth-child(7), td:nth-child(7) { width: 21%; } /* Last 5 */

        tr td:first-child { border-radius: 4px 0 0 4px; font-weight: bold; color: var(--accent); }
        tr td:last-child { border-radius: 0 4px 4px 0; }
        
        .match-badge { display: inline-block; width: 16px; height: 18px; line-height: 18px; text-align: center; border-radius: 3px; font-weight: bold; font-size: 0.6rem; margin: 0 0.5px; }
        .bg-green { background-color: #166534; color: #4ade80; }
        .bg-red { background-color: #991b1b; color: #f87171; }
        body.light .bg-green { background-color: #dcfce7; color: #166534; }
        body.light .bg-red { background-color: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <h1>Player Ranking</h1>
        <button onclick="document.body.classList.toggle('light')">Theme</button>
    </div>
    <table id="rankingTable">
        <thead>
            <tr>
                <th>#</th><th>Player</th><th>GP</th><th>AVG</th><th>MAX</th><th>MIN</th><th>L5</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
    const SHEET_ID = '16OTm4bC-YKAoJl7Rsw8bQLfrdYvUsbZ94Vic65KcMEY';
    const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Ranking`;

    fetch(URL)
        .then(res => res.text())
        .then(data => {
            const json = JSON.parse(data.substr(47).slice(0, -2));
            const tbody = document.querySelector('#rankingTable tbody');
            
            json.table.rows.forEach((row, index) => {
                const player = row.c[0]?.v;
                // Prekidamo petlju ili preskačemo ako je red prazan ili ako naiđemo na "Legend"
                if (!player || player === "Legend") return;

                const gp = row.c[1]?.v || '';
                const goals = row.c[2]?.v ? Number(row.c[2].v).toFixed(2) : '';
                const max = row.c[3]?.v || '';
                const min = row.c[4]?.v || '';

                let matchesHtml = '';
                for (let i = 5; i <= 9; i++) {
                    const val = row.c[i]?.v;
                    if (val !== undefined && val !== null && val !== '') {
                        const score = Number(val);
                        const badgeClass = score >= 34 ? 'bg-green' : 'bg-red';
                        matchesHtml += `<span class="match-badge ${badgeClass}">${score}</span>`;
                    }
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${player}</td>
                    <td>${gp}</td>
                    <td style="font-weight:bold;">${goals}</td>
                    <td>${max}</td>
                    <td>${min}</td>
                    <td>${matchesHtml}</td>
                `;
                tbody.appendChild(tr);
            });
        });
</script>
</body>
</html>
